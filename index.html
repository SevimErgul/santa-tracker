<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Santa Tracker – Global Christmas Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #1a1a1a;
    font-family: Arial, sans-serif;
}

#map {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    height: 100vh;
    width: 100vw;
    z-index: 1;
}
#header {
    position: absolute;
    top: 10px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 1000;
    color: white;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 1px 1px 3px #000;
    padding: 10px;
    background-color: rgba(0, 0, 0, 0.7);
    pointer-events: none;
}

#countdown {
    position: absolute;
    top: 50px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 1000;
    color: #FFD700;
    font-size: 14px;
    font-weight: bold;
    text-shadow: 1px 1px 2px #000;
    padding: 5px;
    background-color: rgba(0, 0, 0, 0.7);
    pointer-events: none;
}

.santa-marker {
    font-size: 32px;
    text-align: center;
    line-height: 1;
    text-shadow: 0 0 10px rgba(0,0,0,0.5);
    animation: bounce 1s infinite;
}

@keyframes bounce { 
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-8px) scale(1.1); }
}

.snowflake {
    position: absolute;
    top: -10px;
    color: white;
    font-size: 12px;
    user-select: none;
    z-index: 999;
    pointer-events: none;
    animation-name: fall;
    animation-timing-function: linear;
    will-change: transform, opacity;
}
@keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
}

/* Error message styling */
#error-message {
    display: none;
    position: fixed;
    top: 50%;
    left: 20px;
    right: 20px;
    transform: translateY(-50%);
    background-color: rgba(255, 0, 0, 0.8);
    color: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    z-index: 2000;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
}
</style>
</head>
<body>
<div id="header">🎅 Santa Tracker – Global</div>
<div id="countdown"></div>
<div id="map"></div>
<div id="error-message">Oops! Something went wrong. Please check your internet connection and try again.</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Error handling
function showError(message) {
    console.error(message);
    const errorEl = document.getElementById('error-message');
    if (errorEl) {
        errorEl.textContent = message || 'Oops! Something went wrong.';
        errorEl.style.display = 'block';
        
        // Hide error after 5 seconds
        setTimeout(() => {
            errorEl.style.display = 'none';
        }, 5000);
    }
}

// Initialize the application when the DOM is fully loaded
document.addEventListener('DOMContentLoaded', function() {
    try {
        // Initialize the map
      const map = L.map('map', {
    // Bu ayarları kaldırarak veya true yaparak mobil etkileşimleri etkinleştiriyoruz.
    zoomControl: true, // Zoom kontrol düğmelerini gösterir
    dragging: true, // Haritayı sürüklemeyi (kaydırmayı) etkinleştirir
    touchZoom: true, // Dokunmatik zoom'u (çift parmakla sıkıştırma/açma) etkinleştirir
    scrollWheelZoom: false, // Scroll tekerleğiyle zoom'u kapalı bıraktım, isteğe bağlı açabilirsiniz
    doubleClickZoom: true, // Çift tıklama ile zoom'u etkinleştirir
    boxZoom: true, // Kutu zoom'u etkinleştirir
    keyboard: true, // Klavye navigasyonunu etkinleştirir
    tap: true // Dokunmatik cihazlar için tıklama olaylarını iyileştirir
}).setView([20, 0], 2);

        // Create Santa marker
        const santaIcon = L.divIcon({
            html: '🎅',
            className: 'santa-marker',
            iconSize: [32, 32],
            iconAnchor: [16, 32],
            popupAnchor: [0, -32]
        });

        // Add Santa marker to map
        const santaMarker = L.marker([20, 0], { icon: santaIcon }).addTo(map);

        // Tile layers with error handling
        const dayTile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
            maxZoom: 18, 
            attribution: '© OpenStreetMap',
            errorTileUrl: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'
        });
        
        const nightTile = L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.png', { 
            maxZoom: 20, 
            attribution: '© Stadia Maps',
            errorTileUrl: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'
        });

        // Add day tile by default
        dayTile.addTo(map);

        // Handle map resize for mobile
        function handleResize() {
            map.invalidateSize({ pan: false });
        }
        
        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', handleResize);

        // Initialize countdown
        function updateCountdown() {
            try {
                const now = new Date();
                const year = now.getFullYear();
                let xmas = new Date(`December 25, ${year} 00:00:00`);
                
                if (now > xmas) {
                    xmas = new Date(`December 25, ${year + 1} 00:00:00`);
                }
                
                const diff = xmas - now;
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const secs = Math.floor((diff % (1000 * 60)) / 1000);
                
                const countdownEl = document.getElementById('countdown');
                if (countdownEl) {
                    countdownEl.textContent = `🎄 Christmas in ${days}d ${hours}h ${mins}m ${secs}s`;
                }
            } catch (error) {
                showError('Error updating countdown: ' + error.message);
            }
        }

        // Start countdown
        updateCountdown();
        setInterval(updateCountdown, 1000);

        // Snow effect
        function createSnow() {
            try {
                const snow = document.createElement('div');
                snow.className = 'snowflake';
                snow.style.left = Math.random() * 100 + 'vw';
                snow.style.fontSize = (10 + Math.random() * 10) + 'px';
                snow.style.animationDuration = (5 + Math.random() * 5) + 's';
                snow.textContent = '❄';
                document.body.appendChild(snow);
                
                // Remove snowflake after animation completes
                setTimeout(() => {
                    if (snow.parentNode) {
                        snow.remove();
                    }
                }, 10000);
            } catch (error) {
                console.error('Error creating snowflake:', error);
            }
        }

        // Start snow effect
        setInterval(createSnow, 300);
        
        // Initial snowflakes
        for (let i = 0; i < 10; i++) {
            setTimeout(createSnow, i * 300);
        }

        // Initial map resize
        setTimeout(() => {
            map.invalidateSize({ pan: false });
        }, 100);

    } catch (error) {
        showError('Failed to initialize the map: ' + error.message);
    }
});
</script>
</body>
</html>
