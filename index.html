<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Santa Tracker – Mobile Friendly</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
html, body {
    margin:0; padding:0;
    height:100%; width:100%;
    overflow:hidden;
    background:#1a1a1a;
}
#map { height:100%; width:100%; }
#header, #countdown {
    position:absolute;
    width:100%;
    text-align:center;
    z-index:9999;
    text-shadow:1px 1px 3px #000;
}
#header { top:10px; font-size:22px; font-weight:bold; color:white; }
#countdown { top:45px; font-size:18px; font-weight:bold; color:#FFD700; }

.snowflake {
  position:absolute; top:-10px; color:white; font-size:12px; user-select:none; z-index:9999; pointer-events:none;
  animation-name:fall; animation-timing-function:linear;
}
@keyframes fall {
  0% { transform: translateY(0) rotate(0deg); opacity:1; }
  100% { transform: translateY(100vh) rotate(360deg); opacity:0; }
}
</style>
</head>
<body>

<div id="header">🎅 Santa Tracker</div>
<div id="countdown"></div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ---------------- Map ---------------- */
const map = L.map('map', { zoomControl:false, dragging:false }).setView([20,0],2);

// WebView uyumlu ücretsiz tile (Carto Positron)
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
    subdomains: 'abcd',
    maxZoom:19
}).addTo(map);

/* ---------------- Santa Icon ---------------- */
// Güvenilir HTTPS icon
const santaIcon = L.icon({
    iconUrl:'https://upload.wikimedia.org/wikipedia/commons/8/88/Santa_Claus_icon.png',
    iconSize:[50,50]
});

/* ---------------- Cities & Marker ---------------- */
const cities=[
  {lat:90,lng:0,city:"North Pole",tz:0},
  {lat:59.33,lng:18.07,city:"Stockholm",tz:1},
  {lat:51.51,lng:0.13,city:"London",tz:0},
  {lat:48.85,lng:2.35,city:"Paris",tz:1},
  {lat:40.71,lng:-74.01,city:"New York",tz:-5},
  {lat:34.05,lng:-118.24,city:"Los Angeles",tz:-8},
  {lat:35.68,lng:139.76,city:"Tokyo",tz:9},
  {lat:-33.87,lng:151.21,city:"Sydney",tz:10},
  {lat:90,lng:0,city:"North Pole",tz:0}
];

let currentIndex=0;
let santaMarker=L.marker([cities[0].lat,cities[0].lng],{icon:santaIcon}).addTo(map);

/* ---------------- Marker Animation (Fixed Map) ---------------- */
function animateSanta(marker){
    const nextIndex = (currentIndex+1)%cities.length;
    const start=cities[currentIndex];
    const end=cities[nextIndex];
    let stepCount=100;
    let step=0;

    const latStep = (end.lat - start.lat)/stepCount;
    const lngStep = (end.lng - start.lng)/stepCount;

    const moveInterval = setInterval(()=>{
        if(step>=stepCount){
            clearInterval(moveInterval);
            currentIndex=nextIndex;
            animateSanta(marker);
        } else {
            const lat=start.lat+latStep*step;
            const lng=start.lng+lngStep*step;
            marker.setLatLng([lat,lng]);
            step++;
        }
    },40); // smooth
}

animateSanta(santaMarker);

/* ---------------- Countdown ---------------- */
function updateCountdown(){
    let now=new Date();
    let year=now.getFullYear();
    let xmas=new Date(`December 25, ${year} 00:00:00`);
    if(now>xmas) xmas=new Date(`December 25, ${year+1} 00:00:00`);
    let diff=xmas-now;
    let days=Math.floor(diff/(1000*60*60*24));
    let hours=Math.floor((diff%(1000*60*60*24))/(1000*60*60));
    let mins=Math.floor((diff%(1000*60*60))/(1000*60));
    let secs=Math.floor((diff%(1000*60))/1000);
    document.getElementById('countdown').innerText=`🎄 Christmas in ${days}d ${hours}h ${mins}m ${secs}s`;
}
setInterval(updateCountdown,1000);
updateCountdown();

/* ---------------- Snow ---------------- */
function createSnow(){
    const snow=document.createElement('div');
    snow.className='snowflake';
    snow.style.left=Math.random()*100+'vw';
    snow.style.fontSize=(10+Math.random()*10)+'px';
    snow.style.animationDuration=(5+Math.random()*5)+'s';
    snow.innerText='❄';
    document.body.appendChild(snow);
    setTimeout(()=>snow.remove(),10000);
}
setInterval(createSnow,150);

</script>
</body>
</html>
