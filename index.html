<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Santa Tracker – Global Christmas Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
* {
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
}
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #1a1a1a;
    font-family: Arial, sans-serif;
    touch-action: none;
}
#map {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    height: 100% !important;
    width: 100% !important;
    transition: filter 1s ease;
    z-index: 1;
}
#header {
    position: fixed;
    top: 10px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 1000;
    color: white;
    font-size: 18px;
    font-weight: bold;
    text-shadow: 1px 1px 3px #000;
    padding: 10px;
    background-color: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(5px);
}
#countdown {
    position: fixed;
    top: 50px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 1000;
    color: #FFD700;
    font-size: 14px;
    font-weight: bold;
    text-shadow: 1px 1px 2px #000;
    padding: 5px;
    background-color: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(5px);
}

.santa-icon { 
    animation: bounce 1.2s infinite;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
}
@keyframes bounce { 
    0% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-6px) scale(1.1); }
    100% { transform: translateY(0) scale(1); } 
}

.snowflake {
    position: absolute;
    top: -10px;
    color: white;
    font-size: 12px;
    user-select: none;
    z-index: 999;
    pointer-events: none;
    animation-name: fall;
    animation-timing-function: linear;
    will-change: transform, opacity;
}
@keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
}

/* Error message styling */
#error-message {
    display: none;
    position: fixed;
    top: 50%;
    left: 20px;
    right: 20px;
    transform: translateY(-50%);
    background-color: rgba(255, 0, 0, 0.8);
    color: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
    z-index: 2000;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
}
</style>
</head>
<body>
<div id="header">🎅 Santa Tracker – Global</div>
<div id="countdown"></div>
<div id="map"></div>
<div id="error-message">Oops! Something went wrong. Please check your internet connection and try again.</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Error handling
function showError(message) {
    const errorEl = document.getElementById('error-message');
    errorEl.textContent = message || 'Oops! Something went wrong.';
    errorEl.style.display = 'block';
    
    // Hide error after 5 seconds
    setTimeout(() => {
        errorEl.style.display = 'none';
    }, 5000);
}

try {
    /* ----------------- Map Initialization ----------------- */
    const map = L.map('map', {
        zoomControl: false,
        dragging: false,
        touchZoom: false,
        scrollWheelZoom: false,
        doubleClickZoom: false,
        boxZoom: false,
        keyboard: false,
        tap: false,
        zoomSnap: 0.1,
        zoomDelta: 0.1
    }).setView([20, 0], 2);

    // Tile layers with error handling
    const dayTile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
        maxZoom: 18, 
        attribution: '© OpenStreetMap',
        errorTileUrl: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'
    });
    
    const nightTile = L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.png', { 
        maxZoom: 20, 
        attribution: '© Stadia Maps',
        errorTileUrl: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'
    });
    if(now>xmas) xmas = new Date(`December 25, ${year+1} 00:00:00`);
    let diff = xmas-now;
    let days = Math.floor(diff/(1000*60*60*24));
    let hours = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
    let mins = Math.floor((diff%(1000*60*60))/(1000*60));
    let secs = Math.floor((diff%(1000*60))/1000);
    document.getElementById('countdown').innerText = `🎄 Christmas in ${days}d ${hours}h ${mins}m ${secs}s`;
}
setInterval(updateCountdown,1000);
updateCountdown();

/* ----------------- Snow Effect ----------------- */
function createSnow(){
    const snow = document.createElement('div');
    snow.className='snowflake';
    snow.style.left=Math.random()*100+'vw';
    snow.style.fontSize=(10+Math.random()*10)+'px';
    snow.style.animationDuration=(5+Math.random()*5)+'s';
    snow.innerText='❄';
    document.body.appendChild(snow);
    setTimeout(()=>snow.remove(),10000);
}
setInterval(createSnow,150);

</script>
</body>
</html>
