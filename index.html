<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Santa Tracker – Christmas Map</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #e00000; /* yılbaşı kırmızı */
        font-family: Arial, sans-serif;
    }
    #map {
        height: 100%;
        width: 100%;
    }

    /* Yılbaşı başlık */
    #header {
        position: absolute;
        top: 10px;
        width: 100%;
        text-align: center;
        z-index: 9999;
        color: white;
        font-size: 22px;
        font-weight: bold;
        text-shadow: 2px 2px 4px #000;
    }

    /* Santa ikonu */
    .santa-icon {
        animation: bounce 1.2s infinite;
    }

    @keyframes bounce {
        0% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
        100% { transform: translateY(0); }
    }
</style>
</head>

<body>

<div id="header">🎅 Santa Tracker – Live</div>
<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Haritayı başlat
    const map = L.map('map', {
        zoomControl: false
    }).setView([40, 0], 2); // dünya görünümü

    // Ücretsiz OpenStreetMap tile
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // Santa ikonu (CDN)
    const santaIcon = L.icon({
        iconUrl: "https://i.imgur.com/9QjvZ2M.png",
        iconSize: [100, 100],
        className: "santa-icon"
    });

    // Santa'nın başlangıç konumu (Kuzey Kutbu)
    let santaLat = 90;
    let santaLng = 0;

    const santaMarker = L.marker([santaLat, santaLng], { icon: santaIcon }).addTo(map);

    // Santa'yı rastgele hareket ettiren basit animasyon
    function moveSanta() {
        santaLat += (Math.random() - 0.5) * 2;
        santaLng += (Math.random() - 0.5) * 2;

        if (santaLat > 90) santaLat = 89;
        if (santaLat < -90) santaLat = -89;

        santaMarker.setLatLng([santaLat, santaLng]);
    }

    // Her 2 saniyede bir hareket
    setInterval(moveSanta, 2000);
</script>

</body>
</html>
