<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Santa Tracker – Live Christmas Map</title>

<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
html, body { margin:0; padding:0; height:100%; background:#1a1a1a; font-family: Arial, sans-serif; }
#map { height:100%; width:100%; transition: filter 1s ease; }

#header { position:absolute; top:10px; width:100%; text-align:center; z-index:9999; color:white; font-size:22px; font-weight:bold; text-shadow:2px 2px 4px #000; }
#countdown { position:absolute; top:45px; width:100%; text-align:center; z-index:9999; color:#FFD700; font-size:18px; font-weight:bold; text-shadow:1px 1px 3px #000; }

/* Santa Marker Animation */
.santa-icon { animation:bounce 1.2s infinite; }
@keyframes bounce { 0%{transform:translateY(0);}50%{transform:translateY(-6px);}100%{transform:translateY(0);} }

/* Snow Effect */
.snowflake {
  position:absolute; top:-10px; color:white; font-size:12px;
  user-select:none; z-index:9999; pointer-events:none;
  animation-name:fall; animation-timing-function:linear;
}
@keyframes fall {
  0% { transform: translateY(0) rotate(0deg); opacity:1; }
  100% { transform: translateY(100vh) rotate(360deg); opacity:0; }
}
</style>
</head>
<body>

<div id="header">🎅 Santa Tracker – Live</div>
<div id="countdown"></div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ----------------- Map ----------------- */
const map = L.map('map', { zoomControl:false }).setView([20,0], 2);
const dayTile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:18, attribution:'© OpenStreetMap' });
const nightTile = L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.png', { maxZoom:20, attribution:'© Stadia Maps' });
dayTile.addTo(map);

/* ----------------- Santa Icon ----------------- */
const santaIcon = L.icon({ iconUrl:'https://i.imgur.com/9QjvZ2M.png', iconSize:[80,80], className:'santa-icon' });

/* ----------------- Route ----------------- */
const route = [
  {lat:90, lng:0, city:"North Pole"},
  {lat:59.95, lng:30.33, city:"St. Petersburg, Russia"},
  {lat:48.85, lng:2.35, city:"Paris, France"},
  {lat:52.52, lng:13.40, city:"Berlin, Germany"},
  {lat:51.51, lng:-0.13, city:"London, UK"},
  {lat:40.71, lng:-74.00, city:"New York, USA"},
  {lat:34.05, lng:-118.24, city:"Los Angeles, USA"},
  {lat:35.68, lng:139.76, city:"Tokyo, Japan"},
  {lat:55.75, lng:37.62, city:"Moscow, Russia"},
  {lat:90, lng:0, city:"North Pole"}
];

let currentIndex = 0;
let santaMarker = L.marker([route[0].lat, route[0].lng], {icon: santaIcon}).addTo(map);

/* ----------------- Smooth Animation ----------------- */
function animateSanta(marker, start, end, duration){
    let startTime = null;
    function step(timestamp){
        if(!startTime) startTime = timestamp;
        let progress = (timestamp - startTime) / duration;
        if(progress > 1) progress = 1;

        let lat = start.lat + (end.lat - start.lat) * progress;
        let lng = start.lng + (end.lng - start.lng) * progress;
        marker.setLatLng([lat,lng]);
        map.panTo([lat,lng], {animate:true, duration:0.5});

        // Gece/Gündüz modu
        let hour = new Date().getUTCHours() + lng/15; // rough local time
        if(hour < 0) hour += 24; if(hour >=24) hour -=24;
        if(hour>=18 || hour<6){ map.getContainer().style.filter='brightness(0.4)'; }
        else { map.getContainer().style.filter='brightness(1)'; }

        if(progress < 1){
            window.requestAnimationFrame(step);
        } else {
            currentIndex = (currentIndex + 1) % route.length;
            animateSanta(marker, end, route[currentIndex], 4000);
        }
    }
    window.requestAnimationFrame(step);
}
animateSanta(santaMarker, route[0], route[1], 4000);

/* ----------------- Countdown ----------------- */
function updateCountdown(){
    let now = new Date();
    let year = now.getFullYear();
    let xmas = new Date(`December 25, ${year} 00:00:00`);
    if(now > xmas) xmas = new Date(`December 25, ${year+1} 00:00:00`);
    let diff = xmas - now;
    let days = Math.floor(diff/(1000*60*60*24));
    let hours = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
    let mins = Math.floor((diff%(1000*60*60))/(1000*60));
    let secs = Math.floor((diff%(1000*60))/1000);
    document.getElementById('countdown').innerText = `🎄 Christmas in ${days}d ${hours}h ${mins}m ${secs}s`;
}
setInterval(updateCountdown,1000);
updateCountdown();

/* ----------------- Snow Effect ----------------- */
function createSnow(){
    const snow = document.createElement('div');
    snow.className = 'snowflake';
    snow.style.left = Math.random()*100+'vw';
    snow.style.fontSize = (10 + Math.random()*10) + 'px';
    snow.style.animationDuration = (5 + Math.random()*5) + 's';
    snow.innerText = '❄';
    document.body.appendChild(snow);
    setTimeout(()=> snow.remove(), 10000);
}
setInterval(createSnow, 150);

</script>
</body>
</html>
