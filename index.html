<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Santa Tracker – Global Christmas Map (Sabit)</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
      integrity="sha256-p4QLQ/7Jk7D5N7zX0Y2F2o6N7P0f4b5H5J7z5N5B7N4=" 
      crossorigin=""/>

<style>
/* Mobil uyumluluk için temel ayarlar */
html, body {
    margin:0;
    padding:0;
    height:100%;
    width:100%;
    overflow:hidden;
    background:#1a1a1a;
    font-family: Arial, sans-serif;
}
#map {
    height:100%;
    width:100%;
    transition: filter 0.8s ease; 
}
#header {
    position:absolute;
    top:10px;
    width:100%;
    text-align:center;
    z-index:9999;
    color:white;
    font-size:22px;
    font-weight:bold;
    text-shadow:2px 2px 4px #000;
}
#countdown {
    position:absolute;
    top:45px;
    width:100%;
    text-align:center;
    z-index:9999;
    color:#FFD700;
    font-size:18px;
    font-weight:bold;
    text-shadow:1px 1px 3px #000;
}

/* Santa Animasyonu */
.santa-icon { animation:bounce 1.2s infinite; }
@keyframes bounce { 0%{transform:translateY(0);}50%{transform:translateY(-8px);}100%{transform:translateY(0);} }

/* Kar Efekti (Değişmedi) */
.snowflake {
  position:absolute;
  top:-10px;
  color:white;
  font-size:12px;
  user-select:none;
  z-index:9999;
  pointer-events:none;
  animation-name:fall;
  animation-timing-function:linear;
}
@keyframes fall {
  0% { transform: translateY(0) rotate(0deg); opacity:1; }
  100% { transform: translateY(100vh) rotate(360deg); opacity:0; }
}
</style>
</head>
<body>

<div id="header">🎅 Santa Tracker – Global (Sabit Harita)</div>
<div id="countdown"></div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
        integrity="sha256-20n65A92v3G5t8k3vFhB3H32n26q5f8k7w3X0F0w5t4="
        crossorigin=""></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    
    /* ----------------- Marker Görünmeme Sorunu İçin Geçici Çözüm ----------------- */
    // Leaflet'ın varsayılan ikon dosyalarını kullanmak için ayarlama yapıldı. 
    // Bu, Base64 ikonun çalışmaması durumunda varsayılan marker'ın görünmesini sağlar.
    delete L.Icon.Default.prototype._get  IconUrl;

    L.Icon.Default.mergeOptions({
        iconRetinaUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png',
        iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
        shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
    });

    try {
        /* ----------------- Map Başlatma ----------------- */
        const map = L.map('map', {
            zoomControl: false,
            // Harita kaydırma ve zoom özelliklerini tamamen kapalı tutuyoruz
            dragging: false, 
            touchZoom: false,
            scrollWheelZoom: false,
            doubleClickZoom: false,
            boxZoom: false,
            keyboard: false,
            tap: false
        }).setView([20, 0], 2); // Harita Dünya merkezinde sabit kalacak

        // Harita Katmanları (HTTPS)
        const dayTile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
            maxZoom: 18, 
            attribution: '© OpenStreetMap'
        });
        
        const nightTile = L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.png', { 
            maxZoom: 20, 
            attribution: '© Stadia Maps'
        });
        
        dayTile.addTo(map);

        // Marker/İkon Tanımı: Eğer Base64 sorunluysa, bu kısım da sorunun kaynağıdır.
        // Şimdilik Leaflet'ın varsayılan marker'ını (yukarıda tanımlanan) kullanacağız.
        // Eğer illa Santa ikonu gelmeli diyorsanız, Santa ikon dosyasını uygulamanızın local assets'ine koyup buradaki URL'yi local yolla değiştirmeniz gerekir.
        const santaIcon = L.icon({
            // Base64 ikon kaldırıldı. Yerine, .santa-icon class'ı ile sadece görsel animasyon verildi.
            iconSize: [50, 50],
            className: 'santa-icon' 
        });


        /* ----------------- Santa Rotası ----------------- */
        const cities = [
            {lat:90,lng:0,city:"North Pole",tz:0},
            {lat:78.22,lng:-73.57,city:"Alert, Canada",tz:-5},
            {lat:64.20,lng:-51.73,city:"Nuuk, Greenland",tz:-3},
            {lat:59.33,lng:18.07,city:"Stockholm, Sweden",tz:1},
            {lat:51.51,lng:0.13,city:"London, UK",tz:0},
            {lat:48.85,lng:2.35,city:"Paris, France",tz:1},
            {lat:52.52,lng:13.40,city:"Berlin, Germany",tz:1},
            {lat:40.71,lng:-74.01,city:"New York, USA",tz:-5},
            {lat:34.05,lng:-118.24,city:"Los Angeles, USA",tz:-8},
            {lat:19.43,lng:-99.13,city:"Mexico City, Mexico",tz:-6},
            {lat:-23.55,lng:-46.63,city:"Sao Paulo, Brazil",tz:-3},
            {lat:35.68,lng:139.76,city:"Tokyo, Japan",tz:9},
            {lat:1.29,lng:103.85,city:"Singapore",tz:8},
            {lat:-33.87,lng:151.21,city:"Sydney, Australia",tz:10},
            {lat:90,lng:0,city:"North Pole",tz:0}
        ];

        let currentIndex = 0;
        // Marker'ı varsayılan ikonla (veya Base64 ikonun çalışması durumunda onunla) başlat
        let santaMarker = L.marker([cities[0].lat, cities[0].lng], {icon:santaIcon}).addTo(map);

        /* ----------------- Akıcı Hareket ve Gece/Gündüz (Harita Kayması Kaldırıldı) ----------------- */
        function animateSanta(marker, start, end, duration) {
            let startTime = null;

            function step(timestamp) {
                if (!startTime) startTime = timestamp;
                let progress = (timestamp - startTime) / duration;
                if (progress > 1) progress = 1;

                let lat = start.lat + (end.lat - start.lat) * progress;
                let lng = start.lng + (end.lng - start.lng) * progress;
                
                // *** KENDİ KENDİNE HAREKETİ ENGELLEYEN KISIM: ***
                // Marker'ı hareket ettir, ancak haritayı pan yapma (panTo kaldırıldı).
                marker.setLatLng([lat, lng]); 

                // Gece/Gündüz modu kontrolü
                const utcHour = new Date().getUTCHours();
                const localHour = (utcHour + end.tz + 24) % 24;
                
                if (localHour >= 19 || localHour < 7) { 
                    map.getContainer().style.filter = 'brightness(0.35)'; 
                    if (!map.hasLayer(nightTile)) {
                        nightTile.addTo(map);
                        dayTile.remove();
                    }
                } else {
                    map.getContainer().style.filter = 'brightness(1)';
                    if (!map.hasLayer(dayTile)) {
                        dayTile.addTo(map);
                        nightTile.remove();
                    }
                }

                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    // Animasyon bitti, bir sonraki şehre geç
                    currentIndex = (currentIndex + 1) % cities.length;
                    const nextCity = cities[currentIndex];
                    const nextDuration = nextCity.city === "North Pole" ? 8000 : 4000; 

                    animateSanta(marker, end, nextCity, nextDuration);
                }
            }
            window.requestAnimationFrame(step);
        }

        // Harita yüklenir yüklenmez animasyonu başlat
        animateSanta(santaMarker, cities[0], cities[1], 4000);

    } catch (e) {
        // Hata durumunda kullanıcıya bilgi ver
        document.getElementById('map').innerHTML = '<div style="color:red; text-align:center; padding-top:50vh; transform:translateY(-50%);">Harita yüklenirken bir sorun oluştu. Lütfen WebView ayarlarınızı kontrol edin.</div>';
        console.error("Harita Başlatma Hatası:", e);
    }
    
    /* ----------------- Geri Sayım ve Kar Efekti (Değişmedi) ----------------- */
    function updateCountdown() {
        let now = new Date();
        let year = now.getFullYear();
        let xmas = new Date(`December 25, ${year} 00:00:00`);
        if (now > xmas) xmas = new Date(`December 25, ${year + 1} 00:00:00`);
        let diff = xmas - now;
        let days = Math.floor(diff / (1000 * 60 * 60 * 24));
        let hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        let mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        let secs = Math.floor((diff % (1000 * 60)) / 1000);
        
        if (diff > 0) {
            document.getElementById('countdown').innerText = `🎄 Yılbaşına Son: ${days}g ${hours}s ${mins}d ${secs}s`;
        } else {
            document.getElementById('countdown').innerText = `🎉 Mutlu Noeller! 🎁`;
        }
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();

    function createSnow() {
        const snow = document.createElement('div');
        snow.className = 'snowflake';
        snow.style.left = Math.random() * 100 + 'vw';
        snow.style.fontSize = (10 + Math.random() * 10) + 'px';
        snow.style.animationDuration = (5 + Math.random() * 5) + 's';
        snow.innerText = '❄';
        document.body.appendChild(snow);
        setTimeout(() => snow.remove(), 10000);
    }
    setInterval(createSnow, 150);
});
</script>
</body>
</html>
