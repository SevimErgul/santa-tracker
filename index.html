<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Santa Tracker – Global Christmas Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
/* Önceki stil kodları aynı kaldı, sadece map ve marker ile ilgili kısım aşağıda güncellendi */
html, body {
    margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden;
    background: #1a1a1a; font-family: Arial, sans-serif;
}
#map {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    height: 100vh; width: 100vw; z-index: 1;
}
#header, #countdown {
    position: absolute; left: 0; right: 0; text-align: center; z-index: 1000;
    background-color: rgba(0, 0, 0, 0.7); padding: 5px 10px;
}
#header { top: 10px; color: white; font-size: 18px; font-weight: bold; text-shadow: 1px 1px 3px #000; }
#countdown { top: 50px; color: #FFD700; font-size: 14px; font-weight: bold; text-shadow: 1px 1px 2px #000; }

.santa-marker {
    font-size: 32px; text-align: center; line-height: 1;
    text-shadow: 0 0 10px rgba(0,0,0,0.5);
    transition: transform 0.5s ease-in-out; /* Hareket animasyonu için ekledik */
}

@keyframes bounce { 
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-8px) scale(1.1); }
}

/* Yeni: Ziyaret edilen yerler için marker stili */
.stop-marker {
    font-size: 18px;
    color: #f44336; /* Kırmızı renk */
    text-shadow: 0 0 5px white;
}

/* Kar efekti (snowflake) ve hata mesajı stilleri aynı */
.snowflake { /* ... */ }
@keyframes fall { /* ... */ }
#error-message { /* ... */ }
</style>
</head>
<body>
<div id="header">🎅 Santa Tracker – Global</div>
<div id="countdown"></div>
<div id="map"></div>
<div id="error-message">Oops! Something went wrong. Please check your internet connection and try again.</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// Error handling
function showError(message) {
    console.error(message);
    const errorEl = document.getElementById('error-message');
    if (errorEl) {
        errorEl.textContent = message || 'Oops! Something went wrong.';
        errorEl.style.display = 'block';
        setTimeout(() => {
            errorEl.style.display = 'none';
        }, 5000);
    }
}

// Global Marker katmanı (ziyaret edilen yerleri tutmak için)
let visitedLayer = null;

// Noel Baba'nın simüle edilmiş rotası (Doğu'dan Batı'ya doğru saat dilimlerini takip eder)
const santaRoute = [
    { city: "Anadyr, Rusya", lat: 64.73, lng: 177.51, speed: 1.5 }, // UTC+12
    { city: "Tokyo, Japonya", lat: 35.6895, lng: 139.6917, speed: 0.8 }, // UTC+9
    { city: "Sidney, Avustralya", lat: -33.8688, lng: 151.2093, speed: 0.9 }, // UTC+10
    { city: "Pekin, Çin", lat: 39.9042, lng: 116.4074, speed: 0.7 }, // UTC+8
    { city: "Mumbai, Hindistan", lat: 19.0760, lng: 72.8777, speed: 1.1 }, // UTC+5:30
    { city: "Moskova, Rusya", lat: 55.7558, lng: 37.6173, speed: 0.9 }, // UTC+3
    { city: "İstanbul, Türkiye", lat: 41.0082, lng: 28.9784, speed: 1.0 }, // UTC+3
    { city: "Paris, Fransa", lat: 48.8566, lng: 2.3522, speed: 1.2 }, // UTC+1
    { city: "Londra, Birleşik Krallık", lat: 51.5074, lng: 0.1278, speed: 1.0 }, // UTC+0
    { city: "Rio de Janeiro, Brezilya", lat: -22.9068, lng: -43.1729, speed: 1.3 }, // UTC-3
    { city: "New York, ABD", lat: 40.7128, lng: -74.0060, speed: 0.8 }, // UTC-5
    { city: "Los Angeles, ABD", lat: 34.0522, lng: -118.2437, speed: 1.1 }, // UTC-8
    { city: "Honolulu, ABD", lat: 21.3099, lng: -157.8583, speed: 1.5 }, // UTC-10
    // Buraya Kuzey Kutbu'na dönüş rotasını da ekleyebiliriz
    { city: "Kuzey Kutbu", lat: 90.00, lng: 0.00, speed: 0.5 } 
];

// Uygulama başlangıcı
document.addEventListener('DOMContentLoaded', function() {
    try {
        // Harita Başlatma (Kaydırma ve Zoom Açık)
        const map = L.map('map', {
            zoomControl: true,
            dragging: true,
            touchZoom: true,
            scrollWheelZoom: true, // Scroll ile zoom'u açtım
            doubleClickZoom: true,
            boxZoom: true,
            keyboard: true,
            tap: true
        }).setView([20, 0], 2);

        // Ziyaret edilen yerler için katman grubu
        visitedLayer = L.layerGroup().addTo(map);

        // Gece harita katmanı
        const nightTile = L.tileLayer('https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.png', { 
            maxZoom: 20, 
            attribution: '© Stadia Maps',
            errorTileUrl: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'
        });
        nightTile.addTo(map);

        // Santa Marker
        const santaIcon = L.divIcon({
            html: '🎅',
            className: 'santa-marker',
            iconSize: [32, 32],
            iconAnchor: [16, 32],
            popupAnchor: [0, -32]
        });
        const santaMarker = L.marker([santaRoute[0].lat, santaRoute[0].lng], { icon: santaIcon }).addTo(map);

        // Santa Rota Takip Fonksiyonu
        let currentStopIndex = 0;
        
        function moveSanta() {
            if (currentStopIndex >= santaRoute.length - 1) {
                // Rota bitti, başa dön veya Kuzey Kutbu'nda bekle
                santaMarker.setLatLng([90, 0]);
                santaMarker.bindPopup("🎁 Noel Baba Kuzey Kutbu'nda dinleniyor!").openPopup();
                return; 
            }

            const from = santaRoute[currentStopIndex];
            const to = santaRoute[currentStopIndex + 1];
            
            // Marker: Ziyaret edilen yerin işaretlenmesi
            const stopIcon = L.divIcon({
                html: '📍',
                className: 'stop-marker',
                iconSize: [18, 18],
                iconAnchor: [9, 18]
            });

            L.marker([from.lat, from.lng], { icon: stopIcon })
             .addTo(visitedLayer)
             .bindPopup(`🎁 **${from.city}** ziyaret edildi!`);

            // Haritayı Santa'nın yeni durağına odakla
            map.flyTo([to.lat, to.lng], Math.max(map.getZoom(), 4), {
                duration: 2.0 // Hızlı uçuş
            });

            // Gerçekçi animasyon süresi: Uzaklık ve hız faktörüne bağlı
            const distance = santaMarker.getLatLng().distanceTo([to.lat, to.lng]);
            // Örneğin: 1000 km başına 10 saniye animasyon süresi
            const animationDuration = (distance / 100000) * (to.speed || 1) * 1000;
            
            // Animasyon adımları
            let start = null;
            const startLatLng = santaMarker.getLatLng();

            function animate(timestamp) {
                if (!start) start = timestamp;
                const elapsed = timestamp - start;
                const progress = Math.min(1, elapsed / animationDuration);

                // Lineer enterpolasyon (L.LatLng.prototype.interpolate) kullanılarak daha düzgün hareket
                const newLat = startLatLng.lat + (to.lat - startLatLng.lat) * progress;
                const newLng = startLatLng.lng + (to.lng - startLatLng.lng) * progress;
                
                // 180 derece boylam geçişi için wrapAround kullan (Harita kenarından atlama)
                const newLatLng = L.latLng(newLat, newLng);
                const wrappedLatLng = map.wrapLatLng(newLatLng);

                santaMarker.setLatLng(wrappedLatLng);
                santaMarker.bindPopup(`🗺️ Yolda: **${to.city}** hedefine ${Math.round((1 - progress) * 100)}% kaldı.`).openPopup();
                
                // Haritayı Santa'yı merkezde tutacak şekilde kaydır
                map.panTo(wrappedLatLng, { animate: false });

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    currentStopIndex++;
                    // Yeni durak için biraz bekleme süresi (hediyeleri dağıtma simülasyonu)
                    const waitTime = 5000; 
                    setTimeout(moveSanta, waitTime); 
                }
            }
            requestAnimationFrame(animate);
        }

        // İlk hareketten hemen önce haritanın hazır olmasını bekle
        setTimeout(moveSanta, 2000); 

        // Rota ve diğer fonksiyonlar (Countdown, Resize, Snow)
        
        function updateCountdown() {
            // ... (Geri sayım kodu aynı) ...
            try {
                const now = new Date();
                const year = now.getFullYear();
                let xmas = new Date(`December 25, ${year} 00:00:00`);
                
                if (now > xmas) {
                    xmas = new Date(`December 25, ${year + 1} 00:00:00`);
                }
                
                const diff = xmas - now;
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const mins = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const secs = Math.floor((diff % (1000 * 60)) / 1000);
                
                const countdownEl = document.getElementById('countdown');
                if (countdownEl) {
                    countdownEl.textContent = `🎄 Christmas in ${days}d ${hours}h ${mins}m ${secs}s`;
                }
            } catch (error) {
                showError('Error updating countdown: ' + error.message);
            }
        }
        updateCountdown();
        setInterval(updateCountdown, 1000);

        function handleResize() {
            map.invalidateSize({ pan: false });
        }
        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', handleResize);

        function createSnow() {
            try {
                const snow = document.createElement('div');
                snow.className = 'snowflake';
                snow.style.left = Math.random() * 100 + 'vw';
                snow.style.fontSize = (10 + Math.random() * 10) + 'px';
                snow.style.animationDuration = (5 + Math.random() * 5) + 's';
                snow.textContent = '❄';
                document.body.appendChild(snow);
                
                setTimeout(() => {
                    if (snow.parentNode) {
                        snow.remove();
                    }
                }, 10000);
            } catch (error) {
                console.error('Error creating snowflake:', error);
            }
        }
        setInterval(createSnow, 300);
        for (let i = 0; i < 10; i++) {
            setTimeout(createSnow, i * 300);
        }

        setTimeout(() => {
            map.invalidateSize({ pan: false });
        }, 100);

    } catch (error) {
        showError('Failed to initialize the map: ' + error.message);
    }
});
</script>
</body>
</html>
